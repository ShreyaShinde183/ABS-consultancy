<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="darkGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="48" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#darkBg)"/>
  <rect width="100%" height="100%" fill="url(#darkGrid)"/>
  <!-- Glowing gradient orb -->
  <circle cx="80%" cy="30%" r="350" fill="#1e3a8a" fill-opacity="0.35" filter="blur(80px)"/>
  <circle cx="20%" cy="80%" r="280" fill="#0369a1" fill-opacity="0.25" filter="blur(60px)"/>
</svg>
