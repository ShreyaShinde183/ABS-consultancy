<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="60" cy="0" r="1.5" fill="#3b82f6" fill-opacity="0.4"/>
      <circle cx="0" cy="60" r="1.5" fill="#3b82f6" fill-opacity="0.4"/>
    </pattern>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Subtle architectural angular geometric shapes -->
  <polygon points="1200,0 1920,0 1920,800 1400,1080" fill="url(#polyGrad)"/>
  <polygon points="0,400 600,1080 0,1080" fill="url(#polyGrad)"/>
  <circle cx="960" cy="150" r="400" fill="#3b82f6" fill-opacity="0.02"/>
</svg>
